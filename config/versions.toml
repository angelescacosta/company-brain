# Pinned runtime tools and libraries (T2). Tests: tests/integration/test_versions.py.
# Tools with `installer = true` were downloaded from the vendor; see config/install_log.toml.
# Python library versions are locked in uv.lock; the main ones are repeated here.

[tools.ollama]
version = "0.40.6"
installer = true
installed_path = "~/.local/opt/ollama-0.40.6/ollama"

[tools.postgres_app]
version = "2.9.6"
postgresql = "18.6"
installer = true
installed_path = "/Applications/Postgres.app"
bin_dir = "/Applications/Postgres.app/Contents/Versions/18/bin"

[tools.pgvector]
version = "0.8.6"  # bundled with Postgres.app

[tools.lulu]
version = "4.5.3"
installer = true
installed_path = "/Applications/LuLu.app"

[tools.google_drive]
version = "132.0"
installer = true
installed_path = "/Applications/Google Drive.app"

[tools.age]
version = "1.3.2"
installer = true
installed_path = "~/.local/opt/age-1.3.2/age"

[tools.open_webui]
version = "0.12.3"  # `uv tool install open-webui==0.12.3 --python 3.12`

[tools.playwright_chromium]
revision = "1248"  # `uv run playwright install chromium`, Playwright 1.64.0

[tools.uv]
version = "0.13.1"

[libraries]
"docling" = "2.142.1"
"langchain-docling" = "3.0.0"
"ocrmac" = "1.0.1"
"pillow-heif" = "1.8.1"
"pillow" = "13.0.0"
"langchain" = "1.4.6"
"langchain-postgres" = "0.0.19"
"psycopg" = "3.3.6"
"sentence-transformers" = "6.1.0"
"torch" = "2.14.1"
"transformers" = "5.20.2"
"ragas" = "0.4.3"
"python-docx" = "1.2.0"
"fpdf2" = "2.8.9"
"playwright" = "1.64.0"
"ollama" = "0.6.3"
