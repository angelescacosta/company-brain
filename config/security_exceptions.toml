[[exception]]
id = "PYSEC-2026-2447"  # CVE-2025-69872, GHSA-w8v5-vhqr-4h9v; diskcache 5.6.3
severity = "HIGH"
source = "OSV https://api.osv.dev/v1/vulns/PYSEC-2026-2447 (retrieved 2026-10-24)"
exposure = "diskcache is only a dependency of ragas, used by the offline evaluation; this system never configures a ragas cache, so no cache directory is read. The attack needs write access to a cache directory on this Mac, which already means code running as the owner. Not reachable from the chat window or the documents."
owner = "Claude for the project owner; re-checked by T45 and at go-live"
expires = "2026-11-30"  # at the latest, the go-live PRD

